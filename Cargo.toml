[package]
name = "turbosort"
version = "0.2.1"
edition = "2021"
authors = ["Morgan Espitia"]
description = "SIMD-accelerated radix sort for primitive types"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ampactor-labs/turbosort"
homepage = "https://github.com/ampactor-labs/turbosort"
readme = "README.md"
documentation = "https://docs.rs/turbosort"
keywords = ["sort", "radix", "simd", "avx2", "performance"]
categories = ["algorithms", "no-std"]
rust-version = "1.75"
exclude = ["CLAUDE.md", ".claude/", ".github/", "docs/"]

# Release codegen plus debug info, for perf/flamegraph runs (see examples/profile.rs).
[profile.profiling]
inherits = "release"
debug = true

[package.metadata.docs.rs]
# Build docs with every feature so sort_parallel is documented, and enable the
# doc_cfg feature-badges (see the docsrs cfg in lib.rs).
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std"]
std = ["alloc"]
alloc = []
parallel = ["std", "dep:rayon"]

[dependencies]
rayon = { version = "1.10", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.5"
rand = "0.8"
voracious_radix_sort = "1.2"

[[bench]]
name = "sort_bench"
harness = false
