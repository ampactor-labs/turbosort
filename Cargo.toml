[package]
name = "turbosort"
version = "0.1.0"
edition = "2021"
authors = ["Morgan Espitia <morganespitia@gmail.com>"]
description = "SIMD-accelerated radix sort for primitive types"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ampactor/turbosort"
keywords = ["sort", "radix", "simd", "avx2", "performance"]
categories = ["algorithms", "no-std"]
rust-version = "1.75"

[features]
default = ["std"]
std = ["alloc"]
alloc = []
parallel = ["std", "dep:rayon"]

[dependencies]
rayon = { version = "1.10", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.5"
rand = "0.8"

[[bench]]
name = "sort_bench"
harness = false
