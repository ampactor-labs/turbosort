name: release

# Publishes to crates.io and cuts a GitHub Release when a vX.Y.Z tag is pushed.
# Requires a CARGO_REGISTRY_TOKEN repository secret (crates.io API token).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A tag that disagrees with the manifest would publish the wrong
      # version; refuse before touching the registry.
      - name: Check tag matches Cargo.toml version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}" >&2
            exit 1
          fi
      # A tag can point at any commit, including one CI never ran on; refuse
      # to publish one whose tests fail.
      - name: Test
        run: cargo test --release --all-features
      # Re-running the workflow for an already-published tag skips the upload
      # explicitly; any real publish failure (bad token, broken package) fails
      # the job instead of hiding behind an || echo.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if curl -fsSL -A "turbosort-release-workflow" \
              "https://crates.io/api/v1/crates/turbosort/${version}" >/dev/null 2>&1; then
            echo "turbosort ${version} already on crates.io; skipping upload"
          else
            cargo publish --locked
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 ||
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
