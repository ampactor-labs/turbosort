name: release

# Publishes to crates.io and cuts a GitHub Release when a vX.Y.Z tag is pushed.
#
# Authenticates with crates.io Trusted Publishing when it is configured for
# this repository and workflow on crates.io: a short-lived token from GitHub's
# OIDC identity, nothing stored. Until then, or if that step fails, it falls
# back to the CARGO_REGISTRY_TOKEN repository secret.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # the GitHub Release
  id-token: write # the OIDC token that Trusted Publishing exchanges

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing here pushes; keep the token out of .git/config.
          persist-credentials: false
      # A tag that disagrees with the manifest would publish the wrong
      # version; refuse before touching the registry.
      - name: Check tag matches Cargo.toml version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}" >&2
            exit 1
          fi
      # A tag can point at any commit, including one CI never ran on; refuse
      # to publish one whose tests fail.
      - name: Test
        run: cargo test --release --all-features
      # Fails harmlessly until Trusted Publishing is set up on crates.io; the
      # publish step then uses the stored token.
      - name: Authenticate with crates.io (Trusted Publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
        continue-on-error: true
      # Re-running the workflow for an already-published tag skips the upload
      # explicitly; any real publish failure (bad token, broken package) fails
      # the job instead of hiding behind an || echo.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if curl -fsSL -A "turbosort-release-workflow" \
              "https://crates.io/api/v1/crates/turbosort/${version}" >/dev/null 2>&1; then
            echo "turbosort ${version} already on crates.io; skipping upload"
          else
            cargo publish --locked
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 ||
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
